[package]
name = "iconvwadw"
version = "0.1.37"
edition = "2024"

[dependencies]
gtk = {version= "0.11.3", package="gtk4", features=["v4_14"], default-features = false}
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_5"], default-features = false} 
rsvg = {version = "2.62.2", package = "librsvg", default-features = false}


[profile.release]
opt-level = "s"
lto = true
incremental = false
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
