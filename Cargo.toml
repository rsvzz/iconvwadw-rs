[package]
name = "iconvwadw"
version = "0.1.38"
edition = "2024"

[dependencies]
gtk4 = {version= "0.10.3", features=["v4_14"], default-features=false}
libadwaita = { version = "0.8.1", features = ["v1_5"], default-features=false} 
librsvg = {version = "2.61.4", default-features=false}


[profile.release]
opt-level = "s"
lto = true
incremental = false
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
