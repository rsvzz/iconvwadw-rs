[package]
name = "iconvwadw"
version = "0.1.39"
edition = "2024"

[dependencies]
gtk4 = {version= "0.11.5", features=["v4_2"]}
libadwaita = { version = "0.9.2", features = ["v1_7"], default-features=false} 
librsvg = {version = "2.63.3", default-features=false}


[profile.release]
opt-level = "s"
lto = true
incremental = false
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
