[package]
name = "iconvwadw"
version = "0.1.36"
edition = "2024"

[dependencies]
gtk = {version= "0.10.3", package="gtk4", features=["v4_14"], default-features = false}
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_5"], default-features = false} 
rsvg = {version = "2.61.4", package = "librsvg", default-features = false}


[profile.release]
opt-level = "z"
lto = true
incremental = false
codegen-units = 1
strip = true
panic = "abort"